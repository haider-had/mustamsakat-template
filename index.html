/* ============================================================
   🎯 ID DETECTION — Computer Vision for card boundaries
   ============================================================ */
function detectIdQuad(img){
  // Work at reduced resolution
  const MAX=500;
  const scale=Math.min(1,MAX/Math.max(img.width,img.height));
  const W=Math.max(1,Math.round(img.width*scale));
  const H=Math.max(1,Math.round(img.height*scale));
  const c=cv(W,H);
  const ctx=c.getContext('2d');
  ctx.drawImage(img,0,0,W,H);
  const data=ctx.getImageData(0,0,W,H).data;

  // Grayscale
  const gray=new Float32Array(W*H);
  for(let i=0;i<W*H;i++)gray[i]=data[i*4]*0.299+data[i*4+1]*0.587+data[i*4+2]*0.114;

  // 3x3 Gaussian blur
  const blur=new Float32Array(W*H);
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      let s=0,cnt=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const px=x+dx,py=y+dy;
        if(px>=0&&px<W&&py>=0&&py<H){
          const wgt=(dx===0&&dy===0)?4:(dx===0||dy===0?2:1);
          s+=gray[py*W+px]*wgt;cnt+=wgt;
        }
      }
      blur[y*W+x]=s/cnt;
    }
  }

  // Sobel edge magnitude
  const edges=new Float32Array(W*H);
  let sum=0,sumSq=0,n=0;
  for(let y=1;y<H-1;y++){
    for(let x=1;x<W-1;x++){
      const gx=-blur[(y-1)*W+x-1]+blur[(y-1)*W+x+1]-2*blur[y*W+x-1]+2*blur[y*W+x+1]-blur[(y+1)*W+x-1]+blur[(y+1)*W+x+1];
      const gy=-blur[(y-1)*W+x-1]-2*blur[(y-1)*W+x]-blur[(y-1)*W+x+1]+blur[(y+1)*W+x-1]+2*blur[(y+1)*W+x]+blur[(y+1)*W+x+1];
      const m=Math.sqrt(gx*gx+gy*gy);
      edges[y*W+x]=m;sum+=m;sumSq+=m*m;n++;
    }
  }
  const mean=sum/n,std=Math.sqrt(Math.max(0,sumSq/n-mean*mean));
  const thresh=Math.max(25,mean+1.2*std);

  // Find extreme points on strong edges (away from border)
  const border=Math.max(3,Math.round(Math.min(W,H)*0.015));
  let tl=null,tr=null,br=null,bl=null;
  let minTL=Infinity,minTR=Infinity,minBR=Infinity,minBL=Infinity;
  for(let y=border;y<H-border;y++){
    for(let x=border;x<W-border;x++){
      if(edges[y*W+x]<=thresh)continue;
      const sTL=x+y,sTR=(W-x)+y,sBR=(W-x)+(H-y),sBL=x+(H-y);
      if(sTL<minTL){minTL=sTL;tl=[x,y];}
      if(sTR<minTR){minTR=sTR;tr=[x,y];}
      if(sBR<minBR){minBR=sBR;br=[x,y];}
      if(sBL<minBL){minBL=sBL;bl=[x,y];}
    }
  }
  if(!tl||!tr||!br||!bl)return null;
  const quad=[tl,tr,br,bl].map(p=>[p[0]/scale,p[1]/scale]);
  if(!isValidQuad(quad,img.width,img.height))return null;
  return quad;
}

function isValidQuad(q,W,H){
  if(!q||q.length!==4)return false;
  // Bounds
  for(const[x,y]of q)if(x<-5||x>W+5||y<-5||y>H+5)return false;
  // Area via shoelace
  let area=0;
  for(let i=0;i<4;i++){const[x1,y1]=q[i],[x2,y2]=q[(i+1)%4];area+=x1*y2-x2*y1;}
  area=Math.abs(area)/2;
  if(area<W*H*0.10)return false;
  // Convexity
  let sign=0;
  for(let i=0;i<4;i++){
    const a=q[i],b=q[(i+1)%4],c=q[(i+2)%4];
    const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
    if(Math.abs(cr)<1)return false;
    if(sign===0)sign=Math.sign(cr);else if(Math.sign(cr)!==sign)return false;
  }
  // Edge lengths
  const e=[];
  for(let i=0;i<4;i++)e.push(Math.hypot(q[(i+1)%4][0]-q[i][0],q[(i+1)%4][1]-q[i][1]));
  const minE=Math.min(...e),maxE=Math.max(...e);
  if(minE<Math.min(W,H)*0.08)return false;
  if(maxE/minE>4.5)return false;
  // Aspect ratio (opposite edges)
  const avgW=(e[0]+e[2])/2,avgH=(e[1]+e[3])/2;
  const asp=Math.max(avgW,avgH)/Math.min(avgW,avgH);
  if(asp<0.9||asp>3.5)return false;
  return true;
}

function solveHomography(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){
    const[x,y]=src[i],[u,v]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);
  }
  const N=8;
  for(let i=0;i<N;i++){
    let mx=i;
    for(let k=i+1;k<N;k++)if(Math.abs(A[k][i])>Math.abs(A[mx][i]))mx=k;
    [A[i],A[mx]]=[A[mx],A[i]];[b[i],b[mx]]=[b[mx],b[i]];
    if(Math.abs(A[i][i])<1e-10)return null;
    for(let k=i+1;k<N;k++){
      const f=A[k][i]/A[i][i];
      for(let j=i;j<N;j++)A[k][j]-=f*A[i][j];
      b[k]-=f*b[i];
    }
  }
  const h=new Array(N);
  for(let i=N-1;i>=0;i--){
    let s=b[i];
    for(let j=i+1;j<N;j++)s-=A[i][j]*h[j];
    h[i]=s/A[i][i];
  }
  return[h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];
}

function perspectiveWarp(srcCanvas,srcQuad,outW,outH){
  const dstQuad=[[0,0],[outW,0],[outW,outH],[0,outH]];
  const H=solveHomography(dstQuad,srcQuad);
  if(!H)return null;
  const out=cv(outW,outH);
  const outCtx=out.getContext('2d');
  const outImg=outCtx.createImageData(outW,outH);
  const SW=srcCanvas.width,SH=srcCanvas.height;
  const srcData=srcCanvas.getContext('2d').getImageData(0,0,SW,SH).data;
  const od=outImg.data;
  for(let y=0;y<outH;y++){
    for(let x=0;x<outW;x++){
      const w=H[6]*x+H[7]*y+H[8];
      const sx=(H[0]*x+H[1]*y+H[2])/w;
      const sy=(H[3]*x+H[4]*y+H[5])/w;
      if(sx>=0&&sx<SW-1&&sy>=0&&sy<SH-1){
        const x0=Math.floor(sx),y0=Math.floor(sy),fx=sx-x0,fy=sy-y0;
        const idx=(y*outW+x)*4;
        for(let c=0;c<4;c++){
          const i00=(y0*SW+x0)*4+c,i10=(y0*SW+x0+1)*4+c,i01=((y0+1)*SW+x0)*4+c,i11=((y0+1)*SW+x0+1)*4+c;
          od[idx+c]=(1-fx)*(1-fy)*srcData[i00]+fx*(1-fy)*srcData[i10]+(1-fx)*fy*srcData[i01]+fx*fy*srcData[i11];
        }
      }
    }
  }
  outCtx.putImageData(outImg,0,0);
  return out;
}

const PHP={'شخصية 3×4':[30,40],'جواز 3.5×4.5':[35,45],'4×6':[40,60],'2.5×3.5':[25,35],'2×2 إنش':[50.8,50.8],'مخصص':null};

let items=[],nid=1,LAY={W:210,H:297,pages:[]},E=null,dragItem=null,selId=null;
$('paper').innerHTML=Object.keys(PAPERS).map(k=>`<option ${k=='A4'?'selected':''}>${k}</option>`).join('');

function setZoom(z){z=Math.min(200,Math.max(40,Math.round(z)));$('pz').value=z;draw();}
function zoomStep(d){setZoom(+$('pz').value+d);}
function zoomFit(){const[W]=paper();const avail=$('pv').clientWidth-50;setZoom(Math.floor(avail/(W*U)*100));}

function paperChg(){$('cust').style.display=$('paper').value=='مخصص'?'grid':'none';draw();}
function paper(){let w,h;if($('paper').value=='مخصص'){w=toMM(+$('pw').value||21);h=toMM(+$('ph').value||29.7);}else[w,h]=PAPERS[$('paper').value];const o=$('ori').value;if(o=='l'&&w<h)[w,h]=[h,w];if(o=='p'&&w>h)[w,h]=[h,w];return[w,h];}

function add(kind){const b={id:nid++,kind,copies:1,rot:false,rotDeg:0,flipH:false,flipV:false};if(kind=='id')Object.assign(b,{w:85.6,h:54,rad:3,copies:2,front:'',back:'',p:'بطاقة / هوية 85.6×54'});if(kind=='photo')Object.assign(b,{w:35,h:45,rad:0,copies:8,front:'',p:'جواز 3.5×4.5'});if(kind=='text')Object.assign(b,{w:80,h:12,text:'اكتب النص هنا',fs:14,b:true});items.push(b);list();draw();}
const find=id=>items.find(x=>x.id==id);
function S(id,k,v){find(id)[k]=v;drawSoon();}
function SMM(id,k,v){find(id)[k]=toMM(v);drawSoon();}
function pre(id,v){const it=find(id);it.p=v;const t=(it.kind=='id'?IDP:PHP)[v];if(t){it.w=t[0];it.h=t[1];}list();draw();}
function F(id,k,el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const it=find(id);const ref=imgRef(r.result);it[k]=ref;it['o'+k]=ref;list();draw();ed(id,k);};r.readAsDataURL(f);}
function del(id){items=items.filter(x=>x.id!=id);if(selId==id)selId=null;list();draw();}
function mv(id,d){const i=items.findIndex(x=>x.id==id),j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];list();draw();}
function moveTop(id){const i=items.findIndex(x=>x.id==id);if(i<0||i==items.length-1)return;const[x]=items.splice(i,1);items.push(x);list();draw();}
function moveBottom(id){const i=items.findIndex(x=>x.id==id);if(i<=0)return;const[x]=items.splice(i,1);items.unshift(x);list();draw();}
function tg(id){const it=find(id);it.col=!it.col;list();}
function fill(id){const it=find(id),[W,H]=paper(),m=toMM(+$('mg').value||0),g=toMM(+$('gp').value||0);const cw=it.rot?it.h:it.w,ch=it.rot?it.w:it.h;const n=Math.floor((W-2*m+g)/(cw+g))*Math.floor((H-2*m+g)/(ch+g));it.copies=Math.max(1,$('mode').value=='same'&&it.kind=='id'?Math.floor(n/2):n);list();draw();}
function dup(id){const i=items.findIndex(x=>x.id==id);items.splice(i+1,0,{...items[i],id:nid++});list();draw();}
function rotItem(id,deg){const it=find(id);it.rotDeg=((it.rotDeg||0)+deg)%360;list();draw();}
function setRotDeg(id,deg){const it=find(id);it.rotDeg=+deg;list();draw();}
function flip(id,axis){const it=find(id);if(axis=='h')it.flipH=!it.flipH;if(axis=='v')it.flipV=!it.flipV;list();draw();}
function selectItem(id){selId=id;list();draw();}

function presetOpts(P,cur){return Object.keys(P).map(k=>{const v=P[k];let label=k;if(v){label=k.replace(/\d+(?:\.\d+)?\s*×\s*\d+(?:\.\d+)?/g,'').replace(/\s+/g,' ').trim();const w=UNIT==='cm'?+(v[0]/10).toFixed(2):v[0];const h=UNIT==='cm'?+(v[1]/10).toFixed(2):v[1];label=`${label} · ${w}×${h} ${uLabel()}`;}return `<option value="${k}" ${k===cur?'selected':''}>${label}</option>`;}).join('');}

function list(){
  const T={id:'🪪 مستمسك',photo:'🖼️ صورة',text:'🔤 نص'};
  $('list').innerHTML=items.map((it,n)=>{
    const numMM=(k,l)=>`<label>${l}<input type="number" step="0.01" value="${toDisp(it[k])}" oninput="SMM(${it.id},'${k}',+this.value)"></label>`;
    const numRaw=(k,l)=>`<label>${l}<input type="number" value="${it[k]}" oninput="S(${it.id},'${k}',+this.value)"></label>`;
    const im=(k,l)=>`<div style="grid-column:1/3"><label>${l} ${it[k]?'✅':''}<input type="file" accept="image/*" onchange="F(${it.id},'${k}',this)"></label>${it[k]?`<button class="sm" style="margin-top:3px;width:100%" onclick="ed(${it.id},'${k}')">✂️ قص / تدوير / كشف الهوية</button>`:''}</div>`;
    const rd=it.rotDeg||0,isSel=selId==it.id,u=uLabel();
    let h=`<div class="it" draggable="true" data-id="${it.id}" style="${isSel?'border-color:var(--pr);box-shadow:0 0 0 3px var(--pr-ring)':''}">
      <div class="hd"><span class="hdnd">⋮⋮</span><span class="ttl">${n+1}. ${T[it.kind]}</span><span class="acts">
        <button onclick="mv(${it.id},-1)">↑</button><button onclick="mv(${it.id},1)">↓</button>
        <button onclick="moveTop(${it.id})">⏫</button><button onclick="moveBottom(${it.id})">⏬</button>
        ${it.kind!='text'?`<button onclick="fill(${it.id})">🧩</button>`:''}
        <button onclick="dup(${it.id})">⧉</button><button onclick="tg(${it.id})">${it.col?'▸':'▾'}</button>
        <button style="color:var(--dg)" onclick="del(${it.id})">✕</button>
      </span></div>
      <div class="g"${it.col?' style="display:none"':''}>`;
    if(it.kind!='text'){const P=it.kind=='id'?IDP:PHP;h+=`<label style="grid-column:1/3">الحجم<select onchange="pre(${it.id},this.value)">${presetOpts(P,it.p)}</select></label>`;}
    h+=numMM('w',`العرض (${u})`)+numMM('h',`الطول (${u})`)+numRaw('copies','عدد النسخ');
    if(it.kind!='text')h+=numMM('rad',`حواف (${u})`);
    if(it.kind!='text')h+=`<label class="ck" style="align-self:end"><input type="checkbox" ${it.rot?'checked':''} onchange="S(${it.id},'rot',this.checked)">تدوير 90°</label>`;
    h+=`<p class="size-hint">📐 ${fmtDims(it.w,it.h)}</p>`;
    h+=`<div class="qrow"><button onclick="rotItem(${it.id},-90)">⟲ 90°</button><button onclick="rotItem(${it.id},90)">⟳ 90°</button><button onclick="setRotDeg(${it.id},0)">0°</button><button onclick="setRotDeg(${it.id},180)">180°</button><button class="${it.flipH?'on':''}" onclick="flip(${it.id},'h')">↔</button><button class="${it.flipV?'on':''}" onclick="flip(${it.id},'v')">↕</button></div>
      <label style="grid-column:1/3">تدوير حر: <b>${rd}°</b><input type="range" min="-180" max="180" step="1" value="${rd}" oninput="rotLive(${it.id},+this.value,this)"></label>`;
    if(it.kind=='id')h+=im('front','صورة الوجه')+im('back','صورة الظهر');
    if(it.kind=='photo')h+=im('front','الصورة');
    if(it.kind=='text')h+=`<label style="grid-column:1/3">النص<textarea rows="2" oninput="S(${it.id},'text',this.value)">${esc(it.text).replace(/<br>/g,'\n')}</textarea></label>`+numRaw('fs','حجم الخط (pt)')+`<label class="ck" style="align-self:end"><input type="checkbox" ${it.b?'checked':''} onchange="S(${it.id},'b',this.checked)">عريض</label>`;
    return h+'</div></div>';
  }).join('')||'<div class="empty"><div class="empty-icon">📄</div><h3>لا توجد عناصر</h3><p>ابدأ بإضافة مستمسك أو صورة أو نص</p><button class="p" onclick="add(\'id\')">+ إضافة أول عنصر</button></div>';
}

(function(){const listEl=$('list');let lastOver=null;
  listEl.addEventListener('dragstart',e=>{const it=e.target.closest('.it');if(!it)return;dragItem=+it.dataset.id;it.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',it.dataset.id);}catch(_){}});
  listEl.addEventListener('dragend',()=>{listEl.querySelectorAll('.it').forEach(x=>x.classList.remove('drag','over'));dragItem=null;lastOver=null;});
  listEl.addEventListener('dragover',e=>{e.preventDefault();const it=e.target.closest('.it');if(!it||dragItem==null||+it.dataset.id==dragItem)return;if(lastOver&&lastOver!=it)lastOver.classList.remove('over');it.classList.add('over');lastOver=it;});
  listEl.addEventListener('drop',e=>{e.preventDefault();const it=e.target.closest('.it');if(!it)return;const tId=+it.dataset.id;if(dragItem==null||tId==dragItem)return;const from=items.findIndex(x=>x.id==dragItem),to=items.findIndex(x=>x.id==tId);if(from<0||to<0)return;const[x]=items.splice(from,1);items.splice(to,0,x);dragItem=null;list();draw();});
})();

function marks(w,h){const o=.8,L=2.5,t=.15,m=(l,tp,ww,hh)=>`<i class="mk" style="left:${l}mm;top:${tp}mm;width:${ww}mm;height:${hh}mm"></i>`;let r='';for(const y of[0,h])r+=m(-o-L,y-t/2,L,t)+m(w+o,y-t/2,L,t);for(const x of[0,w])r+=m(x-t/2,-o-L,t,L)+m(x-t/2,h+o,t,L);return r;}

function cellHtml(c,x,y,side){
  const it=c.it,s=c.side||side,rd=it.rotDeg||0,sx=it.flipH?-1:1,sy=it.flipV?-1:1;
  const tf=[];if(it.rot)tf.push('rotate(90deg)');if(rd)tf.push(`rotate(${rd}deg)`);if(sx<0||sy<0)tf.push(`scale(${sx},${sy})`);
  const transform=`translate(-50%,-50%)${tf.length?' '+tf.join(' '):''}`;
  let inner;
  if(it.kind=='text')inner=`<div class="tx" style="font-size:${it.fs}pt;font-weight:${it.b?700:400}">${esc(it.text)}</div>`;
  else{const srcRef=s=='back'?it.back:it.front,src=imgSrc(srcRef);inner=src?`<img src="${src}" loading="lazy">`:`<span class="ph">${it.kind=='id'?(s=='back'?'الظهر':'الوجه'):'صورة'}</span>`;}
  const isSel=selId==it.id;
  const handles=isSel?`<div class="sel-h sh-tl"></div><div class="sel-h sh-tr"></div><div class="sel-h sh-bl"></div><div class="sel-h sh-br"></div>`:'';
  return `<div class="ce${it.kind=='text'||imgSrc(s=='back'?it.back:it.front)?' f':''}${isSel?' sel':''}" data-iid="${it.id}" style="left:${x}mm;top:${y}mm;width:${c.w}mm;height:${c.h}mm;border-radius:${it.rad||0}mm" onclick="selectItem(${it.id})"><div class="in" style="width:${it.w}mm;height:${it.h}mm;border-radius:${it.rad||0}mm;overflow:hidden;transform:${transform}">${inner}</div>${$('marks').checked&&(it.kind=='text'||imgSrc(s=='back'?it.back:it.front))?marks(c.w,c.h):''}${handles}</div>`;
}

function draw(){
  const[W,H]=paper(),m=toMM(+$('mg').value||0),g=toMM(+$('gp').value||0),mode=$('mode').value,al=$('al').value,uw=W-2*m,uh=H-2*m;
  $('pgsz').textContent=`@page{size:${W}mm ${H}mm;margin:0}`;
  const cells=[];
  items.forEach(it=>{const cw=it.rot?it.h:it.w,ch=it.rot?it.w:it.h;for(let i=0;i<Math.max(1,it.copies|0);i++){cells.push({it,w:cw,h:ch,side:mode=='same'&&it.kind=='id'?'front':null});if(mode=='same'&&it.kind=='id')cells.push({it,w:cw,h:ch,side:'back'});}});
  const pages=[],rows=[];let y=0,row={c:[],w:0,h:0};
  const flush=()=>{if(!row.c.length)return;const ry=y+(rows.length?g:0);if(rows.length&&ry+row.h>uh){pages.push(rows.splice(0));y=0;row.y=0;}else row.y=ry;rows.push(row);y=row.y+row.h;row={c:[],w:0,h:0};};
  cells.forEach(c=>{if(row.c.length&&row.w+g+c.w>uw)flush();row.w+=(row.c.length?g:0)+c.w;row.c.push(c);row.h=Math.max(row.h,c.h);});
  flush();if(rows.length)pages.push(rows);
  const placed=pages.map(rs=>{const out=[];rs.forEach(r=>{const xs=al=='c'?m+(uw-r.w)/2:al=='r'?m+uw-r.w:m;let x=xs+r.w;r.c.forEach(c=>{x-=c.w;out.push({c,x:+x.toFixed(2),y:+(m+r.y).toFixed(2)});x-=g;});});return out;});
  LAY={W,H,pages:[]};
  const pg=(arr,side,mir,lab)=>LAY.pages.push({side,lab,arr:arr.map(p=>({c:p.c,y:p.y,x:mir?+(W-p.x-p.c.w).toFixed(2):p.x}))});
  placed.forEach((arr,i)=>{pg(arr,'front',false,`صفحة ${i+1} — ${mode=='duplex'?'الوجه':'الطباعة'}`);if(mode=='duplex'){const b=arr.filter(p=>p.c.it.kind=='id');if(b.length)pg(b,'back',true,`صفحة ${i+1} — الظهر`);}});
  const cut=$('cut').checked?'cut':'';
  const k=Math.min(1.5,(($('pv').clientWidth||360)-50)/(W*U))*($('pz').value/100);
  let html='';
  LAY.pages.forEach(p=>{html+=`<div class="lb-wrap"><div class="lb">${p.lab}</div></div><div class="pw" style="width:${W*U*k}px;height:${H*U*k}px"><div class="pg ${cut}" style="width:${W}mm;height:${H}mm;transform:scale(${k})">${p.arr.map(q=>cellHtml(q.c,q.x,q.y,p.side)).join('')}</div></div>`;});
  $('pages').innerHTML=html||'<div class="empty"><div class="empty-icon">🖼️</div><h3>المعاينة فارغة</h3><p>أضف عناصر لتراها هنا</p></div>';
  const used=cells.reduce((a,c)=>a+c.w*c.h,0),cap=uw*uh*Math.max(1,LAY.pages.length),big=cells.some(c=>c.w>uw+.01||c.h>uh+.01);
  $('info').textContent=`${fmtDims(W,H)} · ${LAY.pages.length} صفحة · ${cells.length} عنصر · ${Math.round(used/cap*100)}%${big?' ⚠️':''}`;
  updateStatus();
}

let sbRaf=0;
function updateStatus(){if(sbRaf)return;sbRaf=requestAnimationFrame(()=>{sbRaf=0;if(!LAY.W)return;
  const total=items.reduce((a,x)=>a+Math.max(1,x.copies|0)*($('mode').value=='same'&&x.kind=='id'?2:1),0);
  $('sb-pages').textContent=LAY.pages.length;$('sb-items').textContent=items.length;$('sb-copies').textContent=total;
  $('sb-size').textContent=fmtDims(LAY.W,LAY.H);$('sb-zoom').textContent=$('pz').value+'%';$('zoom-val').textContent=$('pz').value+'%';
  const sel=selId!=null?find(selId):null;$('sb-sel').textContent=sel?`${sel.kind=='id'?'مستمسك':sel.kind=='photo'?'صورة':'نص'} #${sel.id} · ${fmtDims(sel.w,sel.h)}`:'—';
});}

/* ============================================================
   ✨ EDITOR — with ID detection + perspective correction
   ============================================================ */
let edMode='rect'; // 'rect' | 'persp'
let activeCorner=-1;

function ed(id,k){
  const it=find(id),src=imgSrc(it[k]);if(!src)return;
  const im=new Image();
  im.onload=()=>{
    E={it,k,wc:cv(im.width,im.height)};
    E.wc.getContext('2d').drawImage(im,0,0);
    E.base=E.wc;
    E.mode='rect';
    E.corners=null;
    E.detected=false;
    edMode='rect';
    activeCorner=-1;
    const html=`
      <div class="edb">
        <div style="grid-column:1/-1;display:flex;gap:6px;margin-bottom:0">
          <button class="p" id="btn-detect" style="flex:2">✨ كشف الهوية تلقائيًا</button>
          <button id="btn-rect" style="flex:1">🔲 مستطيل</button>
          <button id="btn-persp" style="flex:1">🔷 منظور</button>
        </div>
        <div id="edw"><canvas id="ec"></canvas></div>
        <div class="edc">
          <div id="detect-info" class="detect-banner" style="display:none">
            <span>✨ تم كشف حدود الهوية — اسحب الزوايا للتعديل</span>
          </div>
          <div class="g">
            <label>🔍 زوم<input id="zm" type="range" min="1" max="5" step="0.1" value="1" oninput="edDraw()"></label>
            <button id="pnb" onclick="panTg()" style="align-self:end">✋ تحريك</button>
          </div>
          <div class="bar" style="width:100%">
            <button onclick="rot(-1)">⟲ يسار</button>
            <button onclick="rot(1)">⟳ يمين</button>
            <button onclick="setRect();edDraw()">تلقائي</button>
            <button onclick="E.r={x:0,y:0,w:E.wc.width,h:E.wc.height};edDraw()">كامل</button>
          </div>
          <div class="g">
            <label>السطوع<input id="br" type="range" min="-60" max="60" value="0" oninput="pv()"></label>
            <label>التباين<input id="ct" type="range" min="-40" max="80" value="0" oninput="pv()"></label>
            <label>الحدة<input id="sh" type="range" min="0" max="100" value="0"></label>
            <label style="grid-column:1/3">الميلان <b id="anv">0°</b><input id="an" type="range" min="-45" max="45" step="0.1" value="0" oninput="straighten()"></label>
            <div class="bar" style="grid-column:1/3">
              <button onclick="tl(-.5)">⟲ 0.5°</button>
              <button onclick="tl(0)">صفر</button>
              <button onclick="tl(.5)">⟳ 0.5°</button>
            </div>
            <label>الدقة<select id="up"><option value="1">بدون</option><option value="2">×2</option><option value="3">×3</option><option value="4">×4</option></select></label>
            <label class="ck" style="align-self:end"><input id="lk" type="checkbox">قفل النسبة</label>
          </div>
          <div class="bar" style="width:100%">
            <button onclick="auto(0)">✨ تلقائي</button>
            <button onclick="auto(1)">📄 مستند</button>
            <button onclick="auto(2)">👤 شخصية</button>
            <button onclick="edReset()">استرجاع</button>
          </div>
          <div class="bar" style="width:100%">
            <button class="p" onclick="edOk()">تطبيق</button>
            <button onclick="edCancel()">إلغاء</button>
          </div>
        </div>
      </div>`;
    const win=new Win({
      id:'editor',title:'محرر الصورة',icon:'✂️',
      width:1150,height:750,className:'editor-win',html,
      body:()=>{
        ['br','ct','sh'].forEach(i=>$(i).value=0);
        $('up').value=1;$('an').value=0;$('zm').value=1;
        pv();setRect();
        $('btn-detect').onclick=runAutoDetect;
        $('btn-rect').onclick=()=>setEdMode('rect');
        $('btn-persp').onclick=()=>setEdMode('persp');
        requestAnimationFrame(()=>{edDraw();attachCanvas();});
      },
      onClose:()=>{E=null;}
    });
  };
  im.src=src;
}

function setEdMode(mode){
  if(!E)return;
  edMode=mode;
  E.mode=mode;
  if(mode==='persp'&&!E.corners){
    // Initialize corners to image bounds inset by 10%
    const W=E.wc.width,H=E.wc.height,inset=Math.min(W,H)*0.08;
    E.corners=[
      [inset,inset],
      [W-inset,inset],
      [W-inset,H-inset],
      [inset,H-inset]
    ];
  }
  $('btn-rect').classList.toggle('p',mode==='rect');
  $('btn-persp').classList.toggle('p',mode==='persp');
  edDraw();
}

async function runAutoDetect(){
  if(!E)return;
  const btn=$('btn-detect');
  const origHTML=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML='⏳ جارٍ الكشف…';
  const info=$('detect-info');
  info.style.display='none';

  await new Promise(r=>setTimeout(r,30)); // let UI update

  try{
    const img=new Image();
    img.src=E.wc.toDataURL('image/png');
    await new Promise(r=>{img.onload=r;img.onerror=r;});

    const quad=detectIdQuad(img);

    if(quad&&quad.length===4){
      E.corners=quad;
      E.detected=true;
      edMode='persp';
      E.mode='persp';
      $('btn-rect').classList.remove('p');
      $('btn-persp').classList.add('p');
      info.style.display='flex';
      info.className='detect-banner detected';
      info.innerHTML='<span>✅ تم كشف الهوية بنجاح! اسحب الزوايا الخضراء للتعديل ثم اضغط تطبيق</span>';
      toast('تم كشف الهوية — عدّل الزوايا إن لزم');
      edDraw();
    } else {
      info.style.display='flex';
      info.className='detect-banner failed';
      info.innerHTML='<span>⚠️ لم يتمكن من الكشف التلقائي — جرّب الوضع اليدوي 🔷 منظور أو عدّل الزوايا يدويًا</span>';
      if(!E.corners)setEdMode('persp');
      toast('لم يكشف الهوية — جرّب التعديل اليدوي');
    }

function edDraw(){
  if(!E||!$('ec'))return;
  const W=E.wc.width,H=E.wc.height,a=$('edw');if(!a)return;
  const fit=Math.min((a.clientWidth-12)/W,(a.clientHeight-12)/H);
  let s=Math.max(.01,fit)*$('zm').value;
  const maxPx=4e6;
  if(W*s*H*s>maxPx)s=Math.sqrt(maxPx/(W*H));
  E.s=s;
  const c=$('ec'),x=c.getContext('2d');
  $('anv').textContent=$('an').value+'°';
  const cw=Math.round(W*s),ch=Math.round(H*s);
  if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch;}

  if(edMode==='persp'&&E.corners){
    // Perspective mode: dark overlay + quad clip
    x.drawImage(E.wc,0,0,cw,ch);
    x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,cw,ch);
    // Clip to quad and redraw
    x.save();
    x.beginPath();
    const cs=E.corners.map(([cx,cy])=>[cx*s,cy*s]);
    x.moveTo(cs[0][0],cs[0][1]);
    for(let i=1;i<4;i++)x.lineTo(cs[i][0],cs[i][1]);
    x.closePath();
    x.clip();
    x.drawImage(E.wc,0,0,cw,ch);
    x.restore();
    // Draw quad outline
    x.strokeStyle='#10b981';x.lineWidth=2.5;
    x.beginPath();
    x.moveTo(cs[0][0],cs[0][1]);
    for(let i=1;i<4;i++)x.lineTo(cs[i][0],cs[i][1]);
    x.closePath();
    x.stroke();
    // Draw corners
    const labels=['1','2','3','4'];
    for(let i=0;i<4;i++){
      const[cx,cy]=cs[i];
      const isActive=activeCorner===i;
      x.fillStyle=isActive?'#f59e0b':'#10b981';
      x.beginPath();x.arc(cx,cy,isActive?11:9,0,Math.PI*2);x.fill();
      x.strokeStyle='#fff';x.lineWidth=2;x.stroke();
      x.fillStyle='#fff';x.font='bold 10px Cairo,sans-serif';x.textAlign='center';x.textBaseline='middle';
      x.fillText(labels[i],cx,cy);
    }
  } else {
    // Rect mode (existing)
    const r=E.r;
    x.drawImage(E.wc,0,0,cw,ch);
    x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,cw,ch);
    x.drawImage(E.wc,r.x,r.y,r.w,r.h,r.x*s,r.y*s,r.w*s,r.h*s);
    x.strokeStyle='#10b981';x.lineWidth=2;x.strokeRect(r.x*s,r.y*s,r.w*s,r.h*s);
    x.fillStyle='#10b981';
    [[0,0],[1,0],[0,1],[1,1]].forEach(([a,b])=>x.fillRect((r.x+r.w*a)*s-5,(r.y+r.h*b)*s-5,10,10));
  }
}

let drag=null,pan=false;

function attachCanvas(){
  const ec=$('ec');if(!ec)return;
  const pt=e=>{const b=ec.getBoundingClientRect();return{x:(e.clientX-b.left)*ec.width/b.width/E.s,y:(e.clientY-b.top)*ec.height/b.height/E.s};};

  ec.onpointerdown=e=>{
    if(!E||pan)return;
    ec.setPointerCapture(e.pointerId);
    const p=pt(e);

    if(edMode==='persp'&&E.corners){
      const t=22/E.s;
      // Check corner hit
      for(let i=0;i<4;i++){
        const[cx,cy]=E.corners[i];
        if(Math.abs(p.x-cx)<t&&Math.abs(p.y-cy)<t){
          activeCorner=i;
          drag={m:'corner',idx:i};
          edDraw();
          return;
        }
      }
      // Check inside quad → move all
      if(pointInQuad(p,E.corners)){
        drag={m:'quad',start:p,orig:E.corners.map(c=>[...c])};
      }
    } else {
      const r=E.r,t=18/E.s,cx=[r.x,r.x+r.w],cy=[r.y,r.y+r.h];
      let hit=null;
      for(const a of[0,1])for(const b of[0,1])if(Math.abs(p.x-cx[a])<t&&Math.abs(p.y-cy[b])<t)hit={m:'new',sx:cx[1-a],sy:cy[1-b]};
      drag=hit||(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h?{m:'mv',dx:p.x-r.x,dy:p.y-r.y}:{m:'new',sx:p.x,sy:p.y});
    }
  };

  ec.onpointermove=e=>{
    if(!drag)return;
    const p=pt(e),W=E.wc.width,H=E.wc.height;

    if(drag.m==='corner'){
      const i=drag.idx;
      E.corners[i]=[
        Math.max(0,Math.min(W,p.x)),
        Math.max(0,Math.min(H,p.y))
      ];
      edDraw();
    } else if(drag.m==='quad'){
      let dx=p.x-drag.start.x,dy=p.y-drag.start.y;
      // Clamp delta so all corners stay in bounds
      let minX=Math.min(...drag.orig.map(c=>c[0])),maxX=Math.max(...drag.orig.map(c=>c[0]));
      let minY=Math.min(...drag.orig.map(c=>c[1])),maxY=Math.max(...drag.orig.map(c=>c[1]));
      if(minX+dx<0)dx=-minX;if(maxX+dx>W)dx=W-maxX;
      if(minY+dy<0)dy=-minY;if(maxY+dy>H)dy=H-maxY;
      E.corners=drag.orig.map(([x,y])=>[x+dx,y+dy]);
      edDraw();
    } else {
      const r=E.r;
      if(drag.m==='mv'){r.x=Math.min(Math.max(0,p.x-drag.dx),W-r.w);r.y=Math.min(Math.max(0,p.y-drag.dy),H-r.h);}
      else{
        let px=Math.min(Math.max(0,p.x),W),py=Math.min(Math.max(0,p.y),H),w=px-drag.sx,h=py-drag.sy;
        if($('lk').checked){const q=E.it.w/E.it.h;h=Math.abs(w)/q*(h<0?-1:1);}
        E.r={x:Math.min(drag.sx,drag.sx+w),y:Math.min(drag.sy,drag.sy+h),w:Math.max(8,Math.abs(w)),h:Math.max(8,Math.abs(h))};
      }
      edDraw();
    }
  };

  ec.onpointerup=()=>{drag=null;activeCorner=-1;edDraw();};
}

function pointInQuad(p,q){
  let inside=false;
  for(let i=0,j=3;i<4;j=i++){
    const xi=q[i][0],yi=q[i][1],xj=q[j][0],yj=q[j][1];
    if(((yi>p.y)!==(yj>p.y))&&(p.x<(xj-xi)*(p.y-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}

function edOk(){
  if(!E)return;
  const{it,k}=E;
  const b=+$('br').value,ct=+$('ct').value,sh=+$('sh').value,up=+$('up').value;

  // Build final canvas
  let o;

  if(edMode==='persp'&&E.corners){
    // Compute output dimensions from quad
    const q=E.corners;
    const e1=Math.hypot(q[1][0]-q[0][0],q[1][1]-q[0][1]);
    const e2=Math.hypot(q[2][0]-q[1][0],q[2][1]-q[1][1]);
    const e3=Math.hypot(q[3][0]-q[2][0],q[3][1]-q[2][1]);
    const e4=Math.hypot(q[0][0]-q[3][0],q[0][1]-q[3][1]);
    let outW=Math.round(Math.max((e1+e3)/2,(e2+e4)/2)*up);
    let outH=Math.round(Math.min((e1+e3)/2,(e2+e4)/2)*up);
    // Orient by aspect: use item's aspect as reference
    const itemAspect=it.w/it.h;
    const quadAspect=outW/outH;
    // If item aspect and quad aspect are close, use item's; else use quad's natural
    let finalW,finalH;
    if(Math.abs(itemAspect-quadAspect)/itemAspect<0.15){
      // Snap to item aspect, keeping pixel count
      const pxCount=outW*outH;
      finalW=Math.round(Math.sqrt(pxCount*itemAspect));
      finalH=Math.round(finalW/itemAspect);
      if(finalH>outH*1.5||finalW>outW*1.5){finalW=outW;finalH=outH;}
    } else {
      finalW=outW;finalH=outH;
    }
    finalW=Math.max(100,Math.min(4000,finalW));
    finalH=Math.max(100,Math.min(4000,finalH));

    // Determine corner order: TL, TR, BR, BL based on their positions
    const sorted=sortCorners(q);
    o=perspectiveWarp(E.wc,sorted,finalW,finalH);
    if(!o){
      toast('فشل تصحيح المنظور — تحقق من الزوايا');
      return;
    }
  } else {
    // Rect mode
    const r=E.r;
    const sc=Math.min(up,5000/Math.max(r.w,r.h));
    o=cv(Math.round(r.w*sc),Math.round(r.h*sc));
    const c=o.getContext('2d');
    c.imageSmoothingQuality='high';
    c.drawImage(E.wc,r.x,r.y,r.w,r.h,0,0,o.width,o.height);
  }

  // Apply brightness/contrast
  if(b||ct||sh){
    const c=o.getContext('2d');
    const d=c.getImageData(0,0,o.width,o.height),a=d.data,f=1+ct/100;
    for(let i=0;i<a.length;i+=4)for(let j=0;j<3;j++)a[i+j]=(a[i+j]-128)*f+128+b*2.55;
    c.putImageData(d,0,0);
  }

  if(!$('lk').checked&&Math.abs(o.height/o.width-it.h/it.w)>.02){
    if(!edMode||edMode==='rect'){it.h=Math.round(it.w*o.height/o.width*10)/10;it.p='مخصص';}
  }
  it[k]=imgRef(o.toDataURL('image/jpeg',.96));
  edCancel();list();draw();
  toast(edMode==='persp'?'✅ تم تصحيح الهوية':'✅ تم القص');
}

function sortCorners(q){
  // Sort to TL, TR, BR, BL
  const bySum=q.map((p,i)=>({p,i,s:p[0]+p[1],d:p[0]-p[1]}));
  const tl=bySum.reduce((a,b)=>a.s<b.s?a:b).p;
  const br=bySum.reduce((a,b)=>a.s>b.s?a:b).p;
  const tr=bySum.reduce((a,b)=>a.d>b.d?a:b).p;
  const bl=bySum.reduce((a,b)=>a.d<b.d?a:b).p;
  return[tl,tr,br,bl];
}

const IC={};const ld=s=>IC[s]||(IC[s]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s;}));
async function rp(pg,dpi){const k=dpi/25.4,c=cv(Math.round(LAY.W*k),Math.round(LAY.H*k)),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';
  for(const p of pg.arr){const it=p.c.it,s=p.c.side||pg.side,w=it.w*k,h=it.h*k;
    x.save();x.translate((p.x+p.c.w/2)*k,(p.y+p.c.h/2)*k);
    if(it.rot)x.rotate(Math.PI/2);if(it.rotDeg)x.rotate(it.rotDeg*Math.PI/180);
    const sx=it.flipH?-1:1,sy=it.flipV?-1:1;if(sx<0||sy<0)x.scale(sx,sy);
    if(it.kind=='text'){const fs=it.fs*dpi/72,L=it.text.split('\n');x.fillStyle='#000';x.font=`${it.b?700:400} ${fs}px Cairo,Tahoma,Arial`;x.textAlign='center';x.textBaseline='middle';x.direction='rtl';L.forEach((t,i)=>x.fillText(t,0,(i-(L.length-1)/2)*fs*1.3));}
    else{const srcRef=s=='back'?it.back:it.front,src=imgSrc(srcRef);if(it.rad){x.beginPath();if(x.roundRect)x.roundRect(-w/2,-h/2,w,h,it.rad*k);else x.rect(-w/2,-h/2,w,h);x.clip();}if(src)x.drawImage(await ld(src),-w/2,-h/2,w,h);}
    x.restore();
  }
  return c;
}

async function expPdf(){if(!LAY.pages.length)return;const dpi=Math.min(+$('dpi').value,600),jq=+$('jq').value/100;const en=new TextEncoder(),parts=[],off=[];let len=0,n=LAY.pages.length;
  const put=d=>{const b=typeof d=='string'?en.encode(d):d;parts.push(b);len+=b.length;};const obj=(id,s)=>{off[id]=len;put(`${id} 0 obj\n${s}\nendobj\n`);};

    put(`${a+2} 0 obj\n<</Type/XObject/Subtype/Image/Width ${c.width}/Height ${c.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jb.length}>>\nstream\n`);
