<style>
:root{--bg:#faf9f7;--bg-2:#f5f3f0;--card:#fff;--tx:#1c1917;--tx-2:#44403c;--mu:#78716c;--bd:#e7e5e4;--bd-2:#d6d3d1;--pr:#059669;--pr-hover:#047857;--pr-light:#10b981;--pr-soft:#d1fae5;--pr-softer:#ecfdf5;--pr-ring:rgba(5,150,105,.18);--accent:#f59e0b;--dg:#dc2626;--dg-soft:#fee2e2;--ok:#16a34a;--sh-xs:0 1px 2px rgba(28,25,23,.04);--sh-sm:0 1px 3px rgba(28,25,23,.06),0 1px 2px rgba(28,25,23,.04);--sh:0 4px 12px -2px rgba(28,25,23,.08),0 2px 4px -2px rgba(28,25,23,.06);--sh-lg:0 12px 32px -8px rgba(28,25,23,.12),0 8px 16px -8px rgba(28,25,23,.08);--sh-xl:0 24px 56px -12px rgba(28,25,23,.22);--r-sm:10px;--r:14px;--r-lg:20px;--r-xl:28px;--r-pill:999px;--t:180ms cubic-bezier(.4,0,.2,1)}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--bg-2:#1c1917;--card:#171514;--tx:#fafaf9;--tx-2:#e7e5e4;--mu:#a8a29e;--bd:#292524;--bd-2:#44403c;--pr:#10b981;--pr-hover:#34d399;--pr-light:#6ee7b7;--pr-soft:#064e3b;--pr-softer:#022c22;--pr-ring:rgba(16,185,129,.25);--accent:#fbbf24;--dg:#f87171;--dg-soft:#7f1d1d;--ok:#34d399;--sh-xs:0 1px 2px rgba(0,0,0,.3);--sh-sm:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);--sh:0 4px 12px -2px rgba(0,0,0,.4),0 2px 4px -2px rgba(0,0,0,.3);--sh-lg:0 12px 32px -8px rgba(0,0,0,.5),0 8px 16px -8px rgba(0,0,0,.4);--sh-xl:0 24px 56px -12px rgba(0,0,0,.65)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-bottom:96px;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
header{position:sticky;top:0;z-index:15;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:14px 22px;background:rgba(255,255,255,.82);border-bottom:1px solid var(--bd);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
@media (prefers-color-scheme:dark){header{background:rgba(12,10,9,.82)}}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:42px;height:42px;flex-shrink:0;border-radius:12px;box-shadow:0 4px 12px rgba(5,150,105,.28)}
.brand-text{min-width:0}
.brand-text h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.25;background:linear-gradient(135deg,var(--tx) 0%,var(--pr) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-text p{margin:1px 0 0;font-size:11px;font-weight:500;color:var(--mu)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg-2);border-radius:var(--r-pill);justify-self:center;border:1px solid var(--bd);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 20px;border-radius:var(--r-pill);background:transparent;color:var(--mu);border:0;font-size:13px;font-weight:600;transition:var(--t);white-space:nowrap;cursor:pointer}
.tabs button:hover{color:var(--tx)}
.tabs button.p{background:var(--card);color:var(--pr);box-shadow:var(--sh-sm)}
.tb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb button{background:var(--bg-2);color:var(--tx);border:1px solid var(--bd);padding:8px 14px;font-size:12px;font-weight:600;border-radius:var(--r-pill);transition:var(--t)}
.tb button:hover{background:var(--pr-softer);border-color:var(--pr-soft);color:var(--pr)}
.tb button:active{transform:scale(.96)}
.tb button:disabled{opacity:.35;cursor:not-allowed}
.tb button:disabled:hover{background:var(--bg-2);border-color:var(--bd);color:var(--tx)}
.app{display:grid;grid-template-columns:420px 1fr;gap:20px;padding:20px;max-width:1600px;margin:0 auto;align-items:start}
@media (max-width:960px){header{grid-template-columns:1fr;gap:10px;padding:12px 16px}.tabs{justify-self:stretch}.tabs button{flex:1;padding:8px 12px;font-size:12px}.tb{justify-content:center}.app{grid-template-columns:1fr;padding:12px;gap:14px}}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.box{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-xs)}
.box h2{margin:0 0 14px;font-size:11px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:8px}
.box h2::before{content:"";display:inline-block;width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--pr) 0%,var(--pr-light) 100%)}
label{display:flex;flex-direction:column;font-size:12px;font-weight:600;color:var(--mu);gap:6px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg-2);border:1.5px solid transparent;border-radius:var(--r-sm);padding:9px 12px;width:100%;transition:var(--t);font-size:13px;font-weight:500}
input:hover,select:hover,textarea:hover{background:var(--card);border-color:var(--bd-2)}
input:focus,select:focus,textarea:focus{outline:none;background:var(--card);border-color:var(--pr);box-shadow:0 0 0 4px var(--pr-ring)}
input[type=range]{padding:0;accent-color:var(--pr);background:transparent;border:0;height:24px}
input[type=range]:focus{box-shadow:none;background:transparent;border:0}
textarea{resize:vertical;min-height:48px;font-family:inherit}
.ck{flex-direction:row;align-items:center;gap:8px;color:var(--tx);font-weight:500;cursor:pointer;font-size:13px}
.ck input{width:16px;height:16px;flex-shrink:0;accent-color:var(--pr);cursor:pointer;padding:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:1.5px solid transparent;border-radius:var(--r-pill);padding:10px 18px;background:var(--bg-2);color:var(--tx);font-weight:600;font-size:13px;transition:var(--t);display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
button:hover{background:var(--pr-softer);color:var(--pr)}
button:active{transform:scale(.97)}
button.p{background:linear-gradient(180deg,var(--pr-light) 0%,var(--pr) 100%);color:#fff;box-shadow:0 4px 14px -3px rgba(5,150,105,.45),inset 0 1px 0 rgba(255,255,255,.2)}
button.p:hover{background:linear-gradient(180deg,var(--pr) 0%,var(--pr-hover) 100%);box-shadow:0 6px 20px -4px rgba(5,150,105,.55),inset 0 1px 0 rgba(255,255,255,.2)}
@media (prefers-color-scheme:dark){button.p{background:linear-gradient(180deg,#34d399 0%,#10b981 100%);color:#022c22;box-shadow:0 4px 14px -3px rgba(16,185,129,.5),inset 0 1px 0 rgba(255,255,255,.15)}button.p:hover{background:linear-gradient(180deg,#6ee7b7 0%,#34d399 100%)}}
button.sm{padding:5px 10px;font-size:12px;border-radius:8px}
button:disabled{opacity:.4;cursor:not-allowed}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.bar button{flex:1}
.it{border:1.5px solid var(--bd);border-radius:var(--r);padding:14px;margin-top:10px;background:var(--card);transition:var(--t);position:relative}
.it::before{content:"";position:absolute;top:14px;bottom:14px;right:-1.5px;width:3px;border-radius:3px;background:transparent;transition:var(--t)}
.it:hover{border-color:var(--bd-2);box-shadow:var(--sh-sm)}
.it:hover::before{background:var(--pr-soft)}
.it.drag{opacity:.35}
.it.over{border-color:var(--pr);box-shadow:0 0 0 4px var(--pr-ring)}
.it.over::before{background:var(--pr)}
.it .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;gap:6px}
.it .hd .ttl{flex:1;display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.it .hd .hdnd{cursor:grab;color:var(--mu);font-size:14px;user-select:none;padding:2px 6px;border-radius:6px;background:var(--bg-2);transition:var(--t)}
.it .hd .hdnd:hover{background:var(--pr-soft);color:var(--pr)}
.it .hd .hdnd:active{cursor:grabbing}
.it .hd .acts{display:flex;gap:2px;flex-wrap:nowrap}
.it .hd button{padding:4px 8px;background:transparent;color:var(--mu);font-size:13px;min-width:26px;border:0;border-radius:6px}
.it .hd button:hover{background:var(--pr-soft);color:var(--pr)}
.qrow{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/3}
.qrow button{flex:1;padding:7px 4px;font-size:11px;background:var(--bg-2);border:1px solid transparent;color:var(--tx);border-radius:8px;font-weight:600}
.qrow button:hover{background:var(--pr-softer);color:var(--pr);border-color:var(--pr-soft)}
.qrow button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.pv{min-width:0;background:var(--bg-2);border:1px solid var(--bd);border-radius:var(--r-lg);padding:18px;background-image:radial-gradient(circle,var(--bd-2) 1px,transparent 1px);background-size:18px 18px;background-position:0 0}
.pv-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.info{font-size:12px;color:var(--mu);margin:0;font-weight:500;background:var(--card);padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--bd);box-shadow:var(--sh-xs)}
.pv-zoom{flex-direction:row;align-items:center;gap:10px;background:var(--card);padding:6px 14px;border-radius:var(--r-pill);border:1px solid var(--bd);box-shadow:var(--sh-xs);font-weight:600;color:var(--mu);width:auto}
.pv-zoom input{width:140px;flex:0 0 auto}
.lb{font-size:12px;color:var(--mu);margin:6px 0 10px;text-align:center;font-weight:700;letter-spacing:.03em;display:inline-block;background:var(--card);padding:4px 12px;border-radius:var(--r-pill);border:1px solid var(--bd)}
.lb-wrap{text-align:center}
.pw{margin:0 auto 18px;position:relative}
.pg{background:#fff;position:relative;transform-origin:0 0;direction:ltr;box-shadow:0 10px 30px -8px rgba(28,25,23,.25),0 2px 8px rgba(28,25,23,.08);overflow:hidden;border-radius:4px}
.ce{position:absolute}
.cut .ce.f{outline:.25mm dashed #94a3b8}
.in{position:absolute;left:50%;top:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.in img{width:100%;height:100%;object-fit:fill;display:block}
.ph{font-size:9pt;color:#94a3b8;background:#f1f5f9;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:500}
.tx{color:#000;text-align:center;direction:rtl;width:100%;padding:1mm;line-height:1.3;font-family:Cairo,Tahoma,Arial,sans-serif}
.ce:hover{outline:.3mm dashed var(--pr)}
.ce.sel{outline:.4mm solid var(--pr);outline-offset:1mm}
.mk{position:absolute;background:#000;display:block}
#ed{position:fixed;inset:0;background:rgba(12,10,9,.82);display:none;align-items:center;justify-content:center;z-index:9;padding:14px;backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}
.edb{background:var(--card);border-radius:var(--r-xl);padding:18px;max-width:1240px;width:100%;height:100%;max-height:100%;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:stretch;overflow:hidden;box-shadow:var(--sh-xl);border:1px solid var(--bd)}
#edw{width:100%;min-height:0;height:auto;max-height:none;display:flex;overflow:auto;border-radius:var(--r-lg);background:#1c1917;background-image:linear-gradient(45deg,rgba(255,255,255,.02) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.02) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.02) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.02) 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
#ec{margin:auto;display:block;touch-action:none;border-radius:4px}
.edc{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-inline-end:2px}
@media (max-width:960px){.edb{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,52%) minmax(0,48%)}}
.fab{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.85);border-top:1px solid var(--bd);box-shadow:0 -8px 28px -12px rgba(28,25,23,.2);z-index:8;backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
@media (prefers-color-scheme:dark){.fab{background:rgba(12,10,9,.85)}}
.fab button{flex:1;padding:12px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:18px;font-weight:500}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:var(--r-pill);opacity:0;pointer-events:none;transition:var(--t);z-index:20;font-size:13px;font-weight:600;box-shadow:var(--sh-lg)}
.toast.on{opacity:1;transform:translateX(-50%)}
.qlty{display:flex;align-items:center;gap:10px;grid-column:1/3}
.qlty input{flex:1}
@media print{body{background:#fff;padding:0}header,.panel,.noprint,footer,.info,#ed,.pv-bar,.lb{display:none!important}.app{display:block;padding:0}.pv{background:#fff!important;border:0;padding:0;background-image:none}.pw{width:auto!important;height:auto!important;margin:0}.pg{transform:none!important;box-shadow:none;break-after:page}.ph{display:none}}
</style>
</head>
<body>

<script>
/* ============================================================
   ⚡ PERFORMANCE: Image cache + refs + debounced rendering
   ============================================================ */
const $=i=>document.getElementById(i),
  U=96/25.4,
  cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c},
  esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\n/g,'<br>');

/* Image cache — stores each unique image once by hash */
const IMGC={};
function hashStr(d){
  let h1=5381,h2=52711;
  for(let i=0;i<d.length;i+=13){h1=((h1<<5)+h1)+d.charCodeAt(i);h2=((h2<<5)+h2)^d.charCodeAt(i);h1|=0;h2|=0}
  return (h1>>>0).toString(36)+(h2>>>0).toString(36);
}
function imgRef(dataURL){
  if(!dataURL)return '';
  if(dataURL.startsWith('ref:'))return dataURL;
  const ref='ref:'+hashStr(dataURL)+'x'+dataURL.length.toString(36);
  if(!IMGC[ref])IMGC[ref]=dataURL;
  return ref;
}
function imgSrc(ref){
  if(!ref)return '';
  return ref.startsWith('ref:')?(IMGC[ref]||''):ref;
}

/* Debounced draw via requestAnimationFrame */
let rafId=0;
function drawSoon(){
  if(rafId)return;
  rafId=requestAnimationFrame(()=>{rafId=0;draw()});
}

const PAPERS={A3:[297,420],A4:[210,297],A5:[148,210],A6:[105,148],Letter:[216,279],Legal:[216,356],'10×15 سم':[102,152],'13×18 سم':[127,178],'مخصص':null};
const IDP={'بطاقة / هوية 85.6×54':[85.6,54],'جواز 125×88':[125,88],'A6 105×148':[105,148],'A5 148×210':[148,210],'A4 210×297':[210,297],'مخصص':null};
const PHP={'شخصية 3×4':[30,40],'جواز 3.5×4.5':[35,45],'4×6':[40,60],'2.5×3.5':[25,35],'2×2 إنش':[50.8,50.8],'مخصص':null};

let items=[],nid=1,LAY={W:210,H:297,pages:[]},E=null,dragItem=null,selId=null;

$('paper').innerHTML=Object.keys(PAPERS).map(k=>`<option ${k=='A4'?'selected':''}>${k}</option>`).join('');

function paperChg(){$('cust').style.display=$('paper').value=='مخصص'?'grid':'none';draw()}
function paper(){
  let w,h;
  if($('paper').value=='مخصص'){w=+$('pw').value||100;h=+$('ph').value||100}
  else[w,h]=PAPERS[$('paper').value];
  const o=$('ori').value;
  if(o=='l'&&w<h)[w,h]=[h,w];
  if(o=='p'&&w>h)[w,h]=[h,w];
  return[w,h];
}
function add(kind){
  const b={id:nid++,kind,copies:1,rot:false,rotDeg:0,flipH:false,flipV:false,order:0};
  if(kind=='id')Object.assign(b,{w:85.6,h:54,rad:3,copies:2,front:'',back:'',p:'بطاقة / هوية 85.6×54'});
  if(kind=='photo')Object.assign(b,{w:35,h:45,rad:0,copies:8,front:'',p:'جواز 3.5×4.5'});
  if(kind=='text')Object.assign(b,{w:80,h:12,text:'اكتب النص هنا',fs:14,b:true});
  items.push(b);list();draw();
}
const find=id=>items.find(x=>x.id==id);
function S(id,k,v){find(id)[k]=v;drawSoon()}
function pre(id,v){const it=find(id);it.p=v;const t=(it.kind=='id'?IDP:PHP)[v];if(t){it.w=t[0];it.h=t[1]}list();draw()}
function F(id,k,el){
  const f=el.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const it=find(id);
    const ref=imgRef(r.result);
    it[k]=ref;it['o'+k]=ref;
    list();draw();ed(id,k);
  };
  r.readAsDataURL(f);
}
function del(id){items=items.filter(x=>x.id!=id);list();draw()}
function mv(id,d){const i=items.findIndex(x=>x.id==id),j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];list();draw()}
function moveTop(id){const i=items.findIndex(x=>x.id==id);if(i<0||i==items.length-1)return;const [x]=items.splice(i,1);items.push(x);list();draw()}
function moveBottom(id){const i=items.findIndex(x=>x.id==id);if(i<=0)return;const [x]=items.splice(i,1);items.unshift(x);list();draw()}
function tg(id){const it=find(id);it.col=!it.col;list()}
function fill(id){
  const it=find(id),[W,H]=paper(),m=+$('mg').value||0,g=+$('gp').value||0,
    cw=it.rot?it.h:it.w,ch=it.rot?it.w:it.h,
    n=Math.floor((W-2*m+g)/(cw+g))*Math.floor((H-2*m+g)/(ch+g));
  it.copies=Math.max(1,$('mode').value=='same'&&it.kind=='id'?Math.floor(n/2):n);
  list();draw();
}
function dup(id){const i=items.findIndex(x=>x.id==id);items.splice(i+1,0,{...items[i],id:nid++});list();draw()}
function rotItem(id,deg){const it=find(id);it.rotDeg=((it.rotDeg||0)+deg)%360;list();draw()}
function setRotDeg(id,deg){const it=find(id);it.rotDeg=+deg;list();draw()}
function flip(id,axis){
  const it=find(id);
  if(axis=='h')it.flipH=!it.flipH;
  if(axis=='v')it.flipV=!it.flipV;
  list();draw();
}
function selectItem(id){selId=id;list();draw();document.querySelectorAll('.ce').forEach(el=>el.classList.toggle('sel',el.dataset.iid==String(id)))}
function autoSort(mode){
  if(!mode)return;
  const typeVal=k=>k=='id'?0:k=='photo'?1:2;
  const arr=[...items];
  if(mode=='big')arr.sort((a,b)=>(b.w*b.h)-(a.w*a.h));
  if(mode=='small')arr.sort((a,b)=>(a.w*a.h)-(b.w*b.h));
  if(mode=='type')arr.sort((a,b)=>typeVal(a.kind)-typeVal(b.kind));
  items=arr;list();draw();
}

/* ========== قائمة العناصر ========== */
function list(){
  const T={id:'🪪 مستمسك',photo:'🖼️ صورة معاملة',text:'🔤 نص'};
  $('list').innerHTML=items.map((it,n)=>{
    const num=(k,l,st)=>`<label>${l}<input type="number" ${st||'step="any"'} value="${it[k]}" oninput="S(${it.id},'${k}',+this.value)"></label>`;
    const im=(k,l)=>`<div style="grid-column:1/3"><label>${l} ${it[k]?'✅':''}<input type="file" accept="image/*" onchange="F(${it.id},'${k}',this)"></label>${it[k]?`<button class="sm" style="margin-top:4px;width:100%" onclick="ed(${it.id},'${k}')">✂️ قص / تدوير / تحسين</button>`:''}</div>`;
    const rd=it.rotDeg||0;
    let h=`<div class="it" draggable="true" data-id="${it.id}">
      <div class="hd">
        <span class="hdnd" title="اسحب للترتيب">⋮⋮</span>
        <span class="ttl">${n+1}. ${T[it.kind]}</span>
        <span class="acts">
          <button title="للأعلى" onclick="mv(${it.id},-1)">↑</button>
          <button title="للأسفل" onclick="mv(${it.id},1)">↓</button>
          <button title="للأمام" onclick="moveTop(${it.id})">⏫</button>
          <button title="للخلف" onclick="moveBottom(${it.id})">⏬</button>
          ${it.kind!='text'?`<button title="املأ الورقة" onclick="fill(${it.id})">🧩</button>`:''}
          <button title="تكرار" onclick="dup(${it.id})">⧉</button>
          <button title="طي" onclick="tg(${it.id})">${it.col?'▸':'▾'}</button>
          <button title="حذف" style="color:var(--dg)" onclick="del(${it.id})">✕</button>
        </span>
      </div>
      <div class="g"${it.col?' style="display:none"':''}>`;
    if(it.kind!='text'){
      const P=it.kind=='id'?IDP:PHP;
      h+=`<label style="grid-column:1/3">الحجم<select onchange="pre(${it.id},this.value)">${Object.keys(P).map(k=>`<option ${k==it.p?'selected':''}>${k}</option>`).join('')}</select></label>`;
    }
    h+=num('w','العرض (مم)')+num('h','الطول (مم)')+num('copies','عدد النسخ');
    if(it.kind!='text')h+=num('rad','حواف دائرية (مم)');
    if(it.kind!='text')h+=`<label class="ck" style="align-self:end"><input type="checkbox" ${it.rot?'checked':''} onchange="S(${it.id},'rot',this.checked)">تدوير 90°</label>`;
    h+=`<div class="qrow">
      <button onclick="rotItem(${it.id},-90)" title="90° يسار">⟲ 90°</button>
      <button onclick="rotItem(${it.id},90)" title="90° يمين">⟳ 90°</button>
      <button onclick="setRotDeg(${it.id},0)" title="تصفير">0°</button>
      <button onclick="setRotDeg(${it.id},180)" title="180°">180°</button>
      <button class="${it.flipH?'on':''}" onclick="flip(${it.id},'h')" title="قلب أفقي">↔</button>
      <button class="${it.flipV?'on':''}" onclick="flip(${it.id},'v')" title="قلب عمودي">↕</button>
    </div>
    <label style="grid-column:1/3">تدوير حر: <b>${rd}°</b>
      <input type="range" min="-180" max="180" step="1" value="${rd}" oninput="rotLive(${it.id},+this.value,this)">
    </label>`;
    if(it.kind=='id')h+=im('front','صورة الوجه')+im('back','صورة الظهر');
    if(it.kind=='photo')h+=im('front','الصورة');
    if(it.kind=='text')h+=`<label style="grid-column:1/3">النص<textarea rows="2" oninput="S(${it.id},'text',this.value)">${esc(it.text).replace(/<br>/g,'\n')}</textarea></label>`+num('fs','حجم الخط (pt)')+`<label class="ck" style="align-self:end"><input type="checkbox" ${it.b?'checked':''} onchange="S(${it.id},'b',this.checked)">خط عريض</label>`;
    return h+'</div></div>';
  }).join('')||'<p class="info">أضف مستمسكًا أو صورة أو نصًا للبدء.</p>';
}

/* ========== السحب والإفلات (Event Delegation) ========== */
(function bindDrag(){
  const listEl=$('list');
  let lastOver=null;
  listEl.addEventListener('dragstart',e=>{
    const it=e.target.closest('.it');
    if(!it)return;
    dragItem=+it.dataset.id;
    it.classList.add('drag');
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',it.dataset.id)}catch(_){}
  });
  listEl.addEventListener('dragend',e=>{
    const it=e.target.closest('.it');
    if(it)it.classList.remove('drag');
    listEl.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
    dragItem=null;lastOver=null;
  });
  listEl.addEventListener('dragover',e=>{
    e.preventDefault();
    const it=e.target.closest('.it');
    if(!it||dragItem==null||+it.dataset.id==dragItem)return;
    if(lastOver&&lastOver!=it)lastOver.classList.remove('over');
    it.classList.add('over');lastOver=it;
  });
  listEl.addEventListener('drop',e=>{
    e.preventDefault();
    const it=e.target.closest('.it');
    if(!it)return;
    const tId=+it.dataset.id;
    if(dragItem==null||tId==dragItem)return;
    const from=items.findIndex(x=>x.id==dragItem);
    const to=items.findIndex(x=>x.id==tId);
    if(from<0||to<0)return;
    const [x]=items.splice(from,1);
    items.splice(to,0,x);
    dragItem=null;list();draw();
  });
})();

/* ========== رسم الصفحات ========== */
function cellHtml(c,x,y,side){
  const it=c.it,s=c.side||side;
  const rd=it.rotDeg||0;
  const sx=it.flipH?-1:1,sy=it.flipV?-1:1;
  const transforms=[];
  if(it.rot)transforms.push('rotate(90deg)');
  if(rd)transforms.push(`rotate(${rd}deg)`);
  if(sx<0||sy<0)transforms.push(`scale(${sx},${sy})`);
  const tf=`translate(-50%,-50%)${transforms.length?' '+transforms.join(' '):''}`;
  let inner;
  if(it.kind=='text')inner=`<div class="tx" style="font-size:${it.fs}pt;font-weight:${it.b?700:400}">${esc(it.text)}</div>`;
  else{
    const srcRef=s=='back'?it.back:it.front;
    const src=imgSrc(srcRef);
    inner=src?`<img src="${src}">`:`<span class="ph">${it.kind=='id'?(s=='back'?'الظهر':'الوجه'):'صورة'}</span>`;
  }
  return `<div class="ce${it.kind=='text'||imgSrc(s=='back'?it.back:it.front)?' f':''}${selId==it.id?' sel':''}" data-iid="${it.id}"
    style="left:${x}mm;top:${y}mm;width:${c.w}mm;height:${c.h}mm;border-radius:${it.rad||0}mm"
    onclick="selectItem(${it.id})">
    <div class="in" style="width:${it.w}mm;height:${it.h}mm;border-radius:${it.rad||0}mm;overflow:hidden;transform:${tf}">${inner}</div>${$('marks').checked&&(it.kind=='text'||imgSrc(s=='back'?it.back:it.front))?marks(c.w,c.h):''}
  </div>`;
}

function draw(){
  const [W,H]=paper(),
    m=+$('mg').value||0,
    g=+$('gp').value||0,
    mode=$('mode').value,
    al=$('al').value,
    uw=W-2*m,uh=H-2*m;
  $('pgsz').textContent=`@page{size:${W}mm ${H}mm;margin:0}`;
  const cells=[];
  items.forEach(it=>{
    const cw=it.rot?it.h:it.w,ch=it.rot?it.w:it.h;
    for(let i=0;i<Math.max(1,it.copies|0);i++){
      cells.push({it,w:cw,h:ch,side:mode=='same'&&it.kind=='id'?'front':null});
      if(mode=='same'&&it.kind=='id')cells.push({it,w:cw,h:ch,side:'back'});
    }
  });
  const pages=[],rows=[];let y=0,row={c:[],w:0,h:0};
  const flush=()=>{
    if(!row.c.length)return;
    const ry=y+(rows.length?g:0);
    if(rows.length&&ry+row.h>uh){pages.push(rows.splice(0));y=0;row.y=0}
    else row.y=ry;
    rows.push(row);y=row.y+row.h;row={c:[],w:0,h:0};
  };
  cells.forEach(c=>{
    if(row.c.length&&row.w+g+c.w>uw)flush();
    row.w+=(row.c.length?g:0)+c.w;
    row.c.push(c);
    row.h=Math.max(row.h,c.h);
  });
  flush();
  if(rows.length)pages.push(rows);
  const placed=pages.map(rs=>{
    const out=[];
    rs.forEach(r=>{
      const xs=al=='c'?m+(uw-r.w)/2:al=='r'?m+uw-r.w:m;
      let x=xs+r.w;
      r.c.forEach(c=>{x-=c.w;out.push({c,x:+x.toFixed(2),y:+(m+r.y).toFixed(2)});x-=g});
    });
    return out;
  });
  LAY={W,H,pages:[]};
  const pg=(arr,side,mir,lab)=>LAY.pages.push({side,lab,arr:arr.map(p=>({c:p.c,y:p.y,x:mir?+(W-p.x-p.c.w).toFixed(2):p.x}))});
  placed.forEach((arr,i)=>{
    pg(arr,'front',false,`صفحة ${i+1} — ${mode=='duplex'?'وجه الورقة':'الطباعة'}`);
    if(mode=='duplex'){
      const b=arr.filter(p=>p.c.it.kind=='id');
      if(b.length)pg(b,'back',true,`صفحة ${i+1} — ظهر الورقة`);
    }
  });
  const cut=$('cut').checked?'cut':'',
    k=Math.min(1.5,(($('pv').clientWidth||360)-40)/(W*U))*($('pz').value/100);
  $('pages').innerHTML=LAY.pages.map(p=>
    `<div class="lb-wrap"><div class="lb noprint">${p.lab}</div></div>
     <div class="pw" style="width:${W*U*k}px;height:${H*U*k}px">
       <div class="pg ${cut}" style="width:${W}mm;height:${H}mm;transform:scale(${k})">
         ${p.arr.map(q=>cellHtml(q.c,q.x,q.y,p.side)).join('')}
       </div>
     </div>`
  ).join('')||'<p class="info">لا توجد عناصر بعد.</p>';
  const used=cells.reduce((a,c)=>a+c.w*c.h,0),cap=uw*uh*Math.max(1,LAY.pages.length),big=cells.some(c=>c.w>uw+.01||c.h>uh+.01);
  $('info').textContent=`${W}×${H} مم · ${LAY.pages.length} صفحة · ${cells.length} عنصر · استغلال ${Math.round(used/cap*100)}%${big?' ⚠️':''}`;
}

const IC={},ld=s=>IC[s]||(IC[s]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s}));

async function rp(pg,dpi){
  const k=dpi/25.4,
    c=cv(Math.round(LAY.W*k),Math.round(LAY.H*k)),
    x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingQuality='high';
  for(const p of pg.arr){
    const it=p.c.it,s=p.c.side||pg.side,w=it.w*k,h=it.h*k;
    x.save();
    x.translate((p.x+p.c.w/2)*k,(p.y+p.c.h/2)*k);
    if(it.rot)x.rotate(Math.PI/2);
    if(it.rotDeg)x.rotate(it.rotDeg*Math.PI/180);
    const sx=it.flipH?-1:1,sy=it.flipV?-1:1;
    if(sx<0||sy<0)x.scale(sx,sy);
    if(it.kind=='text'){
      const fs=it.fs*dpi/72,L=it.text.split('\n');
      x.fillStyle='#000';
      x.font=`${it.b?700:400} ${fs}px Cairo,Tahoma,Arial`;
      x.textAlign='center';x.textBaseline='middle';x.direction='rtl';
      L.forEach((t,i)=>x.fillText(t,0,(i-(L.length-1)/2)*fs*1.3));
    } else {
      const srcRef=s=='back'?it.back:it.front;
      const src=imgSrc(srcRef);
      if(it.rad){
        x.beginPath();
        if(x.roundRect)x.roundRect(-w/2,-h/2,w,h,it.rad*k);
        else x.rect(-w/2,-h/2,w,h);
        x.clip();
      }
      if(src)x.drawImage(await ld(src),-w/2,-h/2,w,h);
    }
    x.restore();
    if($('marks').checked&&(it.kind=='text'||imgSrc(s=='back'?it.back:it.front))){
      const X=p.x*k,Y=p.y*k,w2=p.c.w*k,h2=p.c.h*k,o=.8*k,L=2.5*k;
      x.save();x.strokeStyle='#000';x.lineWidth=Math.max(1,.15*k);x.beginPath();
      for(const yy of[Y,Y+h2]){x.moveTo(X-o-L,yy);x.lineTo(X-o,yy);x.moveTo(X+w2+o,yy);x.lineTo(X+w2+o+L,yy)}
      for(const xx of[X,X+w2]){x.moveTo(xx,Y-o-L);x.lineTo(xx,Y-o);x.moveTo(xx,Y+h2+o);x.lineTo(xx,Y+h2+o+L)}
      x.stroke();x.restore();
    }
    if($('cut').checked&&(it.kind=='text'||imgSrc(s=='back'?it.back:it.front))){
      x.save();
      x.setLineDash([6,4]);x.strokeStyle='#888';x.lineWidth=Math.max(1,dpi/150);
      x.beginPath();
      if(x.roundRect)x.roundRect(p.x*k,p.y*k,p.c.w*k,p.c.h*k,(it.rad||0)*k);
      else x.rect(p.x*k,p.y*k,p.c.w*k,p.c.h*k);
      x.stroke();x.restore();
    }
  }
  return c;
}

function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

async function expPdf(){
  if(!LAY.pages.length)return;

    en=new TextEncoder(),parts=[],off=[];let len=0,n=LAY.pages.length;

    const s=`q ${pw} 0 0 ${ph} 0 0 cm /I Do Q`;
    obj(a+1,`<</Length ${s.length}>>\nstream\n${s}\nendstream`);
    off[a+2]=len;
    put(`${a+2} 0 obj\n<</Type/XObject/Subtype/Image/Width ${c.width}/Height ${c.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jb.length}>>\nstream\n`);
    put(jb);put('\nendstream\nendobj\n');
  }
  const N=3+3*n,xr=len;
  let t=`xref\n0 ${N}\n0000000000 65535 f \n`;
  for(let i=1;i<N;i++)t+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  put(t+`trailer\n<</Size ${N}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  dl(new Blob(parts,{type:'application/pdf'}),'id-template.pdf');
  $('st').textContent='تم إنشاء PDF ✅';
}

const SET=['paper','ori','pw','ph','mg','gp','al','cut','marks','mode','dpi','fmt','jq'],LS='mstm-pro-v1';

/* Serialize with/without images */
function getSt(withImgs){
  const o={v:2,nid,set:Object.fromEntries(SET.map(i=>[i,$(i).type=='checkbox'?$(i).checked:$(i).value])),items};
  if(withImgs)o.imgs=IMGC;

function persist(s){
  try{localStorage.setItem(LS,s)}catch(e){
    try{
      const o=JSON.parse(s);delete o.imgs;
      o.items=o.items.map(({front,back,ofront,oback,...r})=>r);
      localStorage.setItem(LS,JSON.stringify(o));
      if(!warned){warned=true;toast('الصور كبيرة: حُفظت الإعدادات فقط — احفظ المشروع كملف 💾')}
    }catch(_){}
  }
}
function schedulePersist(){
  clearTimeout(persistT);
  persistT=setTimeout(()=>persist(getSt(true)),3000);
}
function updBtns(){$('bu').disabled=hi<=0;$('bre').disabled=hi>=hist.length-1}
function snapshot(){
  const hSt=getSt(false);
  if(hSt===lastHistSt)return;
  lastHistSt=hSt;
  hist=hist.slice(0,hi+1);
  hist.push(hSt);
  if(hist.length>15)hist.shift();

function setSt(str){
  const s=JSON.parse(str);
  if(!Array.isArray(s.items))throw 0;
  if(s.imgs&&typeof s.imgs==='object')Object.assign(IMGC,s.imgs);
  hold=true;
  items=s.items;
  nid=s.nid||items.reduce((a,x)=>Math.max(a,x.id),0)+1;
  /* Normalize any legacy data URLs into refs */
  items.forEach(it=>{
    ['front','back','ofront','oback'].forEach(k=>{
      if(it[k]&&!it[k].startsWith('ref:'))it[k]=imgRef(it[k]);
    });
  });
  SET.forEach(i=>{if(!(i in s.set))return;const e=$(i);if(e.type=='checkbox')e.checked=s.set[i];else e.value=s.set[i]});
  $('jqv').textContent=$('jq').value;
  $('cust').style.display=$('paper').value=='مخصص'?'grid':'none';
  selId=null;list();draw();hold=false;
}
function undo(){clearTimeout(tm);snapshot();if(hi>0){hi--;setSt(hist[hi]);lastHistSt=hist[hi];schedulePersist();updBtns()}}
function redo(){clearTimeout(tm);if(hi<hist.length-1){hi++;setSt(hist[hi]);lastHistSt=hist[hi];schedulePersist();updBtns()}}
const _draw=draw;draw=function(){_draw();commit()};

function saveProj(){dl(new Blob([getSt(true)],{type:'application/json'}),`project-${new Date().toISOString().slice(0,10)}.json`);toast('تم حفظ المشروع ✅')}
function openProj(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{setSt(r.result);snapshot();toast('تم فتح المشروع ✅')}catch(e){toast('ملف المشروع غير صالح ❌')}};
  r.readAsText(f);el.value='';
}
function newProj(){if(items.length&&!confirm('بدء مشروع جديد؟ سيتم مسح العناصر الحالية.'))return;items=[];add('id')}
function tpl(v){
  if(!v)return;
  if(items.length&&!confirm('سيتم استبدال العناصر الحالية بالقالب. متابعة؟')){$('tpl').value='';return}
  items=[];$('mode').value='same';
  const A=(k,o)=>{add(k);Object.assign(items[items.length-1],o)},
    P={ph3:['شخصية 3×4',30,40,8],ph35:['جواز 3.5×4.5',35,45,8],ph46:['4×6',40,60,6]};
  if(P[v]){const[p,w,h,n]=P[v];A('photo',{p,w,h,copies:n})}
  if(v=='id')A('id',{copies:2});
  if(v=='mix'){A('id',{copies:1});A('photo',{p:'شخصية 3×4',w:30,h:40,copies:4})}
  $('tpl').value='';list();draw();
}
addEventListener('keydown',e=>{
  const inp=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName),c=e.ctrlKey||e.metaKey;
  if(c&&e.key=='z'&&!inp){e.preventDefault();e.shiftKey?redo():undo()}
  else if(c&&e.key=='y'&&!inp){e.preventDefault();redo()}
  else if(c&&e.key=='s'){e.preventDefault();saveProj()}
  else if(e.key=='Delete'&&!inp&&selId!=null&&$('ed').style.display!='flex'){del(selId);selId=null}
});
addEventListener('beforeunload',()=>{if(persistT){clearTimeout(persistT);try{persist(getSt(true))}catch(_){}}});

/* Bootstrap */
let st=null;try{st=localStorage.getItem(LS)}catch(e){}
if(st){try{setSt(st);snapshot()}catch(e){add('id')}}else add('id');
tab(1);
</script>
